<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitzcrank — Gaming Gear Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0a93f'/%3E%3Cpath d='M18 4 8 18h6l-2 10 12-15h-7z' fill='%23100d05'/%3E%3C/svg%3E" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="Blitzcrank home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1.5 8L19 9h-7l1-7Z" fill="currentColor"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Blitzcrank</span>
          <span class="brand-tag">Gaming Gear Store</span>
        </span>
      </a>

      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Search laptops, GPUs, peripherals, consoles..." autocomplete="off" aria-label="Search products" />
        <button type="submit" class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/></svg>
        </button>
      </form>

      <nav class="header-actions" aria-label="Account and cart">
        <button class="action" id="account-btn" type="button">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.8-3.6 3.8-5.6 7.2-5.6s6.4 2 7.2 5.6"/></svg>
          </span>
          <span class="action-label">Account</span>
        </button>
        <button class="action" id="wishlist-btn" type="button">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.3 4.9 13A4.8 4.8 0 0 1 12 6.4 4.8 4.8 0 0 1 19.1 13Z"/></svg>
            <span class="badge" id="wishlist-count">5</span>
          </span>
          <span class="action-label">Wishlist</span>
        </button>
        <button class="action" id="cart-btn" type="button">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.1 11.2a1.6 1.6 0 0 0 1.6 1.3h7.9a1.6 1.6 0 0 0 1.6-1.2L20.5 8H6"/><circle cx="9.6" cy="20" r="1.4"/><circle cx="16.6" cy="20" r="1.4"/></svg>
            <span class="badge" id="cart-count">3</span>
          </span>
          <span class="action-label">Cart</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="page">
    <section class="featured" aria-labelledby="featured-title">
      <div class="featured-head">
        <div class="featured-titles">
          <h1 id="featured-title" class="featured-title">Featured <span class="gold">Gear</span></h1>
          <p class="featured-sub">Hand-picked hardware this week</p>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="Product categories">
          <button class="filter is-active" data-category="all" role="tab" aria-selected="true">All</button>
          <button class="filter" data-category="laptops" role="tab" aria-selected="false">Laptops</button>
          <button class="filter" data-category="components" role="tab" aria-selected="false">Components</button>
          <button class="filter" data-category="peripherals" role="tab" aria-selected="false">Peripherals</button>
          <button class="filter" data-category="consoles" role="tab" aria-selected="false">Consoles</button>
        </div>
      </div>

      <div class="grid" id="product-grid"><!-- cards injected by script.js --></div>

      <div class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/><path d="M8.5 11h5"/></svg>
        <p class="empty-title">No gear found</p>
        <p class="empty-sub">Try a different search or category.</p>
      </div>
    </section>
  </main>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
